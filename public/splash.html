<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microlit Peristaltic Pump</title>
  <style>
    :root {
      --primary: #2563eb;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-color: #f8fafc;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      /* Make it draggable since it's a frameless window */
      -webkit-app-region: drag;
      user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
    }

    .logo-container {
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
      /* Subtle drop shadow for the logo */
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.05));
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .company-name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 0.5rem 0;
      animation: slideUp 1s ease-out 0.2s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    .product-name {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin: 0;
      letter-spacing: -0.02em;
      animation: slideUp 1s ease-out 0.4s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    .loader-container {
      margin-top: 3rem;
      height: 4px;
      width: 200px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      animation: fadeIn 1s ease-out 0.6s forwards;
      opacity: 0;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--primary);
      width: 30%;
      border-radius: 4px;
      animation: load 1.5s infinite ease-in-out;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes slideUp {
      to { 
        opacity: 1; 
        transform: translateY(0);
      }
    }

    @keyframes load {
      0% { left: -30%; width: 30%; }
      50% { left: 30%; width: 70%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="Microlit Logo" class="logo">
    </div>
    <h2 class="company-name">Microlit</h2>
    <h1 class="product-name">Peristaltic Pump</h1>
    <div class="loader-container">
      <div class="loader-bar"></div>
    </div>
  </div>
</body>
</html>
